<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="900">
<title>Charleston weekend events</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #faf3df;
    --panel-hero: #fcf6e7;
    --panel-edge: #ece1c0;
    --text: #1a2228;
    --muted: #6b5f47;
    --accent: #c8542a;
    --primary: #2d4332;
    --border: #a89274;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    line-height: 1.45;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 80px;
    display: flex;
    align-items: flex-start;
    gap: 36px;
  }
  header {
    flex: 0 0 220px;
    text-align: left;
    position: sticky;
    top: 24px;
  }
  header img.logo { display: block; margin: 0 0 8px; width: 220px; height: auto; max-width: 100%; }
  header h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  header .sub { color: var(--muted); font-size: 12px; }
  .tool-row { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tool-btn {
    font: inherit; cursor: pointer;
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 6px 10px; font-size: 12px;
    color: var(--text);
  }
  .tool-btn:hover { background: var(--panel-hero); }
  .tool-btn.active { background: var(--primary); color: var(--panel); border-color: var(--primary); }
  .content { flex: 1; min-width: 0; }
  @media (max-width: 720px) {
    .wrap { flex-direction: column; gap: 16px; padding: 16px; }
    header { flex: 0 0 auto; position: static; }
    header img.logo { margin: 0 auto 6px; width: 160px; }
  }
  .tabs { display: flex; gap: 4px; margin: 0 0 16px; border-bottom: 2px solid var(--border); }
  .tab {
    background: none; border: none; color: var(--muted);
    padding: 10px 16px; font: inherit; font-weight: 600; font-size: 15px;
    cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--accent); }
  .tab-range { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; font-weight: 400; }
  .panel { display: none; }
  .panel.active { display: block; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--primary); margin: 32px 0 12px; font-weight: 700; }
  .event {
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-left: 5px solid var(--tier); border-radius: 4px;
    margin: 0 0 8px; box-shadow: 0 1px 2px rgba(26,34,40,.06);
    overflow: hidden;
  }
  .event.hero { background: var(--panel-hero); }
  .event[open] { box-shadow: 0 2px 5px rgba(26,34,40,.10); }
  .event > summary {
    list-style: none; cursor: pointer; padding: 10px 14px;
    display: grid; grid-template-columns: 1fr 24px 18px; gap: 4px 12px; align-items: center;
  }
  .event > summary::-webkit-details-marker { display: none; }
  .event > summary::after {
    content: "▾"; grid-column: 3; grid-row: 1 / span 2;
    color: var(--muted); font-size: 14px;
    transition: transform 0.15s ease; align-self: center; text-align: center;
  }
  .event[open] > summary::after { transform: rotate(180deg); }
  .event > summary:hover { background: rgba(45,67,50,.04); }
  .event-meta {
    grid-column: 1;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    font-size: 12px; color: var(--muted);
  }
  .event-title-row {
    grid-column: 1;
    display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline;
  }
  .tier-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tier); flex-shrink: 0; }
  .cat { font-weight: 700; color: var(--primary); text-transform: uppercase;
          letter-spacing: 0.06em; font-size: 11px; }
  .score { margin-left: auto; font-variant-numeric: tabular-nums;
            color: var(--text); font-weight: 400; font-size: 11px; opacity: 0.55; }
  .star-btn {
    grid-column: 2; grid-row: 1 / span 2; align-self: center;
    background: none; border: none; cursor: pointer; padding: 0;
    font-size: 18px; line-height: 1; color: var(--muted); opacity: 0.6;
  }
  .star-btn:hover { opacity: 1; color: var(--accent); }
  .star-btn.starred { color: #d6a82e; opacity: 1; }
  .title { font-size: 15px; line-height: 1.3; font-weight: 700; color: var(--text); }
  .event.hero .title { font-size: 16px; }
  .title a { color: var(--text); text-decoration: none; }
  .title a:hover { color: var(--accent); text-decoration: underline; }
  .loc { color: var(--muted); font-size: 13px; }
  .loc::before { content: "· "; }
  .event-body {
    padding: 12px 14px 14px; border-top: 1px solid rgba(168,146,116,.25);
    background: rgba(0,0,0,.015);
  }
  .venue-full { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .desc { margin: 0 0 10px; font-size: 14px; color: #3a3528; line-height: 1.5; }
  .event-foot {
    display: flex; flex-wrap: wrap; justify-content: space-between;
    align-items: center; gap: 12px;
  }
  .src { font-size: 11px; color: var(--muted); font-style: italic; }
  .cal-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  .cal-btn {
    font: inherit; font-size: 13px; color: var(--accent); font-weight: 600;
    text-decoration: none; background: none; border: none; cursor: pointer; padding: 0;
  }
  .cal-btn:hover { text-decoration: underline; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; font-style: italic; }
  .recurring-section { margin-top: 32px; }
  .recurring-section > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .recurring-section > summary::-webkit-details-marker { display: none; }
  .recurring-section > summary > h2 { margin: 0; }
  .recurring-section > summary::after {
    content: "▾"; color: var(--muted); font-size: 12px;
    transition: transform 0.15s ease;
  }
  .recurring-section[open] > summary::after { transform: rotate(180deg); }
  .recurring-list { margin-top: 10px; }

  /* Settings drawer */
  .settings-overlay {
    position: fixed; inset: 0; background: rgba(26,34,40,.4);
    display: none; z-index: 50;
  }
  .settings-overlay.open { display: block; }
  .settings-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 360px; max-width: 90vw;
    background: var(--bg); border-left: 1px solid var(--panel-edge);
    box-shadow: -4px 0 12px rgba(26,34,40,.10);
    transform: translateX(100%); transition: transform 0.2s ease;
    overflow-y: auto; padding: 20px; z-index: 51;
  }
  .settings-drawer.open { transform: translateX(0); }
  .settings-drawer h3 { margin: 24px 0 8px; font-size: 14px;
                       text-transform: uppercase; letter-spacing: 0.06em;
                       color: var(--primary); }
  .settings-drawer h3:first-child { margin-top: 0; }
  .settings-row { display: flex; align-items: center; gap: 8px; margin: 6px 0;
                  font-size: 13px; }
  .settings-row label { flex: 1; }
  .settings-row input[type=range] { flex: 1; }
  .settings-row .val { width: 36px; text-align: right; font-variant-numeric: tabular-nums;
                       color: var(--muted); font-size: 12px; }
  .settings-actions { display: flex; gap: 8px; margin-top: 24px;
                      padding-top: 16px; border-top: 1px solid var(--panel-edge); }
  .settings-close { position: absolute; top: 12px; right: 12px;
                    background: none; border: none; font-size: 22px;
                    cursor: pointer; color: var(--muted); }
  .settings-close:hover { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="../logo.png" alt="Charleston Weekend Events">
    <h1>Charleston weekend events</h1>
    <div class="sub" id="updated-line">Loading…</div>
    <div class="tool-row">
      <button class="tool-btn" id="settings-btn">⚙ Settings</button>
      <button class="tool-btn" id="starred-btn">★ Starred</button>
    </div>
    <div class="tool-row" style="margin-top:4px">
      <label style="font-size:12px;color:var(--muted)">Sort:</label>
      <select id="sort-mode" style="font:inherit;font-size:12px;border:1px solid var(--panel-edge);border-radius:6px;padding:4px 6px;background:var(--panel)">
        <option value="score">Score</option>
        <option value="date">Date</option>
      </select>
    </div>
  </header>

  <main class="content">
    <nav class="tabs" id="tabs"></nav>
    <section class="panel active" id="panel-this"></section>
    <section class="panel" id="panel-next"></section>
  </main>
</div>

<div class="settings-overlay" id="settings-overlay"></div>
<aside class="settings-drawer" id="settings-drawer" aria-hidden="true">
  <button class="settings-close" id="settings-close" aria-label="Close">×</button>
  <h3>Home neighborhood</h3>
  <div class="settings-row">
    <select id="pref-home" style="width:100%">
    </select>
  </div>

  <h3>Quick filters</h3>
  <label class="settings-row">
    <input type="checkbox" id="pref-free-only">
    <span>Free events only</span>
  </label>
  <div class="settings-row">
    <label>Indoor / outdoor</label>
    <select id="pref-indoor-outdoor" style="flex:1;font:inherit;padding:4px;border:1px solid var(--panel-edge);border-radius:4px;background:var(--panel)">
      <option value="all">All</option>
      <option value="outdoor">Outdoor only</option>
      <option value="indoor">Indoor only</option>
    </select>
  </div>
  <label class="settings-row">
    <input type="checkbox" id="pref-hide-drinking">
    <span>Hide drinking/alcohol events</span>
  </label>

  <h3>Family</h3>
  <label class="settings-row">
    <input type="checkbox" id="pref-show-kid-friendly" checked>
    <span>Show kid-friendly events</span>
  </label>
  <label class="settings-row">
    <input type="checkbox" id="pref-hide-adult-only">
    <span>Hide adult-only (21+ etc.)</span>
  </label>
  <label class="settings-row">
    <input type="checkbox" id="pref-kid-only">
    <span>Show <i>only</i> kid-friendly</span>
  </label>
  <div style="font-size:12px;color:var(--muted);margin:4px 0">Kid age groups to highlight:</div>
  <label class="settings-row"><input type="checkbox" data-age="toddler"><span>Toddler (0–3)</span></label>
  <label class="settings-row"><input type="checkbox" data-age="preschool"><span>Preschool (3–5)</span></label>
  <label class="settings-row"><input type="checkbox" data-age="elementary"><span>Elementary (6–10)</span></label>
  <label class="settings-row"><input type="checkbox" data-age="tween"><span>Tween (11–13)</span></label>
  <label class="settings-row"><input type="checkbox" data-age="teen"><span>Teen (14–17)</span></label>

  <h3>Category weights</h3>
  <div id="pref-categories"></div>

  <h3>Boosts</h3>
  <label class="settings-row">
    <input type="checkbox" id="pref-brand-boost" checked>
    <span>Brand boost (Marsh Wear, Hometeam, …)</span>
  </label>
  <label class="settings-row">
    <input type="checkbox" id="pref-unique-strong-boost" checked>
    <span>Strong rarity boost (annual, inaugural, …)</span>
  </label>
  <label class="settings-row">
    <input type="checkbox" id="pref-unique-soft-boost" checked>
    <span>Soft rarity boost (gala, fundraiser, …)</span>
  </label>
  <label class="settings-row">
    <input type="checkbox" id="pref-unique-skips-price" checked>
    <span>Rare events ignore price penalty</span>
  </label>

  <h3>Price tolerance</h3>
  <div class="settings-row">
    <label>Max comfortable $</label>
    <input type="range" id="pref-price-cap" min="0" max="200" step="5" value="50">
    <span class="val" id="pref-price-cap-val">$50</span>
  </div>
  <label class="settings-row">
    <input type="checkbox" id="pref-hide-over-cap">
    <span>Hide events above max</span>
  </label>

  <h3>Layout</h3>
  <div class="settings-row">
    <label>Max per venue</label>
    <input type="range" id="pref-max-venue" min="1" max="5" step="1" value="2">
    <span class="val" id="pref-max-venue-val">2</span>
  </div>
  <div class="settings-row">
    <label>Max art exhibits</label>
    <input type="range" id="pref-max-art" min="0" max="10" step="1" value="2">
    <span class="val" id="pref-max-art-val">2</span>
  </div>
  <div class="settings-row">
    <label>Tier high cutoff</label>
    <input type="range" id="pref-tier-high" min="0.3" max="1.0" step="0.05" value="0.8">
    <span class="val" id="pref-tier-high-val">0.80</span>
  </div>

  <h3>Hidden events</h3>
  <div id="hidden-list" style="font-size:12px;color:var(--muted)">None hidden.</div>
  <button class="tool-btn" id="pref-unhide-all" style="margin-top:8px;display:none">Unhide all</button>

  <div class="settings-actions">
    <button class="tool-btn" id="pref-reset">Reset to defaults</button>
  </div>
</aside>

<script src="app.js"></script>
</body>
</html>
