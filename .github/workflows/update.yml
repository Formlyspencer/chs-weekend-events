name: Update events

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.github/workflows/update.yml'
      - 'requirements.txt'

permissions:
  contents: write

# Only one "Update events" run at a time. Queue rather than cancel so we
# don't lose a scheduled refresh when a code push happens to overlap.
concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Opt into Node.js 24 for JS-based actions (checkout, setup-python).
    # GitHub is forcing this default on 2026-06-02; opting in now silences
    # the deprecation warning and avoids any surprise on flip day.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: python main.py

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/events.json docs/logo.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update events $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Push with rebase-retry — guards against the rare race where
          # another run / commit lands between our checkout and our push.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; pulling --rebase and retrying"
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts"
          exit 1
